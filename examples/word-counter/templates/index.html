<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Word Counter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; color: #1b1b1b; }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    p.lede { color: #555; margin-top: 0; }
    textarea { width: 100%; height: 9rem; font: inherit; font-size: 1.1rem; padding: 0.6rem; }
    button { margin-top: 0.75rem; font: inherit; font-size: 1.1rem; padding: 0.5rem 1.2rem; background: #7a0000; color: #fff; border: 0; cursor: pointer; }
    .result { margin-top: 1.5rem; padding: 1rem; border-left: 4px solid #7a0000; background: #f4f4f2; font-size: 1.2rem; }
    .result strong { font-size: 1.6rem; }
  </style>
</head>
<body>
  <h1>Word Counter</h1>
  <p class="lede">Paste some text. Get the number of words and the most common one.</p>
  <form method="post">
    <label for="text">Text</label>
    <textarea id="text" name="text">{{ text }}</textarea>
    <button type="submit">Count</button>
  </form>
  {% if result %}
  <div class="result" id="result">
    <div>Words: <strong id="words">{{ result.words }}</strong></div>
    <div>Most common: <strong id="common">{{ result.common or "none" }}</strong></div>
  </div>
  {% endif %}
</body>
</html>
